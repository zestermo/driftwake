name: Set up Godot
description: Godot and the named export templates, cached per OS, version and template set (Linux and Windows runners)
inputs:
  version:
    description: Godot version, e.g. 4.7.2 (must match the editor exactly; the templates are tied to it)
    required: true
  templates:
    description: Template files to keep from the export templates .tpz, space-separated (e.g. web_nothreads_release.zip)
    required: true
outputs:
  bin:
    description: The Godot command (Linux ~/godot/godot; Windows the console build, which prints to the log and returns the exit code)
    value: ${{ steps.bin.outputs.bin }}
runs:
  using: composite
  steps:
    - name: Cache Godot and its templates
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ${{ runner.os == 'Windows' && '~/AppData/Roaming/Godot/export_templates' || '~/.local/share/godot/export_templates' }}
        key: godot-${{ runner.os }}-${{ inputs.version }}-${{ inputs.templates }}

    - name: Install Godot and the templates
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
        TEMPLATES: ${{ inputs.templates }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
        mkdir -p ~/godot
        if [ "$RUNNER_OS" = "Windows" ]; then
          tmp="$(cygpath -u "$RUNNER_TEMP")"
          dir="$(cygpath -u "$APPDATA")/Godot/export_templates/${GODOT_VERSION}.stable"
          # (the editor and its console build keep their own names: the console one finds the editor by name)
          editor="Godot_v${GODOT_VERSION}-stable_win64.exe.zip"
        else
          tmp="$RUNNER_TEMP"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          editor="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
        fi
        curl -fsSL -o "$tmp/godot.zip" "$base/$editor"
        unzip -q "$tmp/godot.zip" -d ~/godot
        if [ "$RUNNER_OS" != "Windows" ]; then mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot; fi
        # (the .tpz holds every platform's templates, ~1 GB: only the ones named are kept)
        curl -fsSL -o "$tmp/templates.tpz" "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
        mkdir -p "$dir"
        files=(templates/version.txt)
        for t in $TEMPLATES; do files+=("templates/$t"); done
        unzip -q -j "$tmp/templates.tpz" "${files[@]}" -d "$dir"
        rm "$tmp/godot.zip" "$tmp/templates.tpz"

    - name: Name the Godot command
      id: bin
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.version }}
      run: |
        if [ "$RUNNER_OS" = "Windows" ]; then bin=~/godot/Godot_v${GODOT_VERSION}-stable_win64_console.exe; else bin=~/godot/godot; fi
        test -f "$bin"
        echo "bin=$bin" >> "$GITHUB_OUTPUT"
