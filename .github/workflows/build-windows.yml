# The Windows build: export the "Windows Desktop" preset on Linux.
# - Every push to main: the build is attached to the run (Actions > the run > Artifacts, 14 days).
# - A version tag (git tag v1.8 && git push origin v1.8): also a GitHub Release with
#   Driftwake-windows.zip, which https://github.com/zestermo/driftwake/releases/latest/download/Driftwake-windows.zip
#   always points at (the website's download button).
name: Build Windows

on:
  push:
    branches: [main]
    tags: ['v*']
    paths-ignore: ['docs/**', '**.md', 'web/site/**']
  workflow_dispatch:

concurrency:
  group: build-windows-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  GODOT_VERSION: 4.7.2

jobs:
  windows:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: windows_release_x86_64.exe windows_release_x86_64_console.exe

      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Export the Windows Desktop preset
        run: |
          set -euo pipefail
          mkdir -p build/windows
          ~/godot/godot --headless --path . --export-release "Windows Desktop" build/windows/Driftwake.exe
          test -f build/windows/Driftwake.exe
          ls -la build/windows
          (cd build/windows && zip -qr ../Driftwake-windows.zip .)

      - name: Attach the build to the run
        uses: actions/upload-artifact@v4
        with:
          name: Driftwake-windows
          path: build/windows/
          retention-days: 14

      - name: Publish the release (version tags)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/Driftwake-windows.zip
          generate_release_notes: true
