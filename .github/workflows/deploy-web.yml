# The browser build: export Godot's "Web" preset on Linux and deploy web/site to Netlify
# (driftwake.fun). Netlify's own Git builds are off (netlify.toml `ignore`): its builders
# have no Godot, so they'd publish the site without the game.
#
# Secrets in the repo's "live" environment: NETLIFY_AUTH_TOKEN (Netlify > User settings >
# Applications > Personal access tokens) and NETLIFY_SITE_ID (Site configuration > Site
# details > Site ID).
name: Deploy web build

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

concurrency:
  group: deploy-web
  cancel-in-progress: true

env:
  # must match the editor exactly: the templates are tied to the version
  GODOT_VERSION: 4.7.2

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # (the Netlify secrets are environment secrets: a job only sees them when it names the environment)
    environment:
      name: live
      url: https://driftwake.fun
    steps:
      - uses: actions/checkout@v4

      - name: Cache Godot and its web template
        id: godot
        uses: actions/cache@v4
        with:
          path: |
            ~/godot
            ~/.local/share/godot/export_templates
          key: godot-${{ env.GODOT_VERSION }}-web-nothreads

      - name: Install Godot and the web template
        if: steps.godot.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL -o /tmp/godot.zip "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          # (the .tpz holds every platform's templates: only the thread-less web one is kept)
          curl -fsSL -o /tmp/templates.tpz "$base/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          dir=~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          mkdir -p "$dir"
          unzip -q -j /tmp/templates.tpz templates/web_nothreads_release.zip templates/version.txt -d "$dir"

      - name: Import the project
        run: ~/godot/godot --headless --path . --import

      - name: Export the Web preset into the site
        run: |
          set -euo pipefail
          mkdir -p web/build
          ~/godot/godot --headless --path . --export-release "Web" web/build/index.html
          test -f web/build/index.wasm
          test -f web/build/index.pck
          rm -rf web/site/play
          cp -r web/build web/site/play
          ls -la web/site/play

      - name: Deploy to Netlify
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        run: npx --yes netlify-cli@17 deploy --dir=web/site --prod --message "${{ github.sha }}"
